name: Bug report
description: Something on this profile or a ProcateSoft project is broken
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please include enough detail to reproduce it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you actually see?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://github.com/procatesoft
        2. Scroll to ...
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Chrome 131 / iPhone 15 Safari
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if it is a visual issue.
